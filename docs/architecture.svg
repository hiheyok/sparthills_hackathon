<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1160" role="img" aria-labelledby="title desc" font-family="Overpass, Segoe UI, Helvetica, Arial, sans-serif">
<title id="title">SupplyLine architecture and parallel planning flow</title>
<desc id="desc">The browser calls an API Gateway HTTP API and one Python Lambda. Lambda serves the app, checks inventory, calls Bedrock Converse with local rules fallbacks, stores neighbor reports in DynamoDB, and fetches driving and walking geometry from OSRM services. The browser separately loads Google Maps or OpenStreetMap tiles. After understanding once, foreground and background plans build concurrently; follow-up questions are handled on demand.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4e6172"/></marker></defs>
<rect width="1500" height="1160" fill="#eef3f7"/>
<text x="40" y="54" font-size="32" fill="#142738" font-weight="700">SupplyLine architecture</text>
<text x="40" y="84" font-size="17" fill="#4e6172">Code checks stock, hours, safety and stop order. Bedrock understands requests, selects substitutes and writes answers.</text>
<rect x="410" y="110" width="1050" height="690" rx="12" fill="none" stroke="#4e6172" stroke-width="2" stroke-dasharray="9 7"/>
<text x="430" y="134" font-size="15" fill="#4e6172" font-weight="700">AWS deployment (us-east-1 by default)</text>
<rect x="440" y="155" width="650" height="70" rx="12" fill="white" stroke="#142738" stroke-width="2"/>
<text x="462" y="184" font-size="21" fill="#142738" font-weight="700">API Gateway HTTP API</text>
<text x="462" y="208" font-size="15" fill="#4e6172">Serves the web app and JSON API through one Lambda integration; throttled</text>
<rect x="40" y="155" width="320" height="245" rx="12" fill="white" stroke="#142738" stroke-width="2"/>
<text x="60" y="188" font-size="21" fill="#142738" font-weight="700">Browser / installable app</text>
<text x="60" y="220" font-size="17" fill="#142738">Request form and progress</text>
<text x="60" y="244" font-size="17" fill="#142738">Driving and walking plans</text>
<text x="60" y="268" font-size="17" fill="#142738">Follow-up questions on demand</text>
<rect x="60" y="295" width="280" height="85" rx="12" fill="#e3edfa" stroke="#1459a4" stroke-width="2"/>
<text x="76" y="321" font-size="16" fill="#1459a4" font-weight="700">Saved plans available offline</text>
<text x="76" y="345" font-size="14" fill="#142738">Service worker: app shell</text>
<text x="76" y="365" font-size="14" fill="#142738">Local storage: plans + road paths</text>
<path d="M360 190 H438" fill="none" stroke="#4e6172" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="371" y="180" font-size="12" fill="#4e6172">HTTPS</text>
<path d="M765 225 V258" fill="none" stroke="#4e6172" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="440" y="260" width="650" height="350" rx="12" fill="white" stroke="#142738" stroke-width="2"/>
<text x="460" y="291" font-size="19" fill="#142738" font-weight="700">One AWS Lambda: Python 3.12, arm64, 512 MB, 29 s</text>
<rect x="460" y="310" width="180" height="125" rx="12" fill="#f5f7fa" stroke="#142738" stroke-width="2"/>
<text x="472" y="337" font-size="17" fill="#142738" font-weight="700">handler.py</text>
<text x="472" y="361" font-size="13" fill="#142738">Routes, validation,</text>
<text x="472" y="383" font-size="13" fill="#142738">rate limits, headers,</text>
<text x="472" y="405" font-size="13" fill="#142738">static files, orchestration</text>
<rect x="655" y="310" width="195" height="125" rx="12" fill="#e3edfa" stroke="#1459a4" stroke-width="2"/>
<text x="667" y="337" font-size="17" fill="#1459a4" font-weight="700">engine.py + geo.py</text>
<text x="667" y="361" font-size="13" fill="#142738">Stock, hours, distance</text>
<text x="667" y="383" font-size="13" fill="#142738">Quantities, safety rules</text>
<text x="667" y="405" font-size="13" fill="#142738">Stops and arrival estimates</text>
<rect x="865" y="310" width="205" height="125" rx="12" fill="#fff4cc" stroke="#9b6a00" stroke-width="2"/>
<text x="877" y="337" font-size="17" fill="#9b6a00" font-weight="700">ai.py</text>
<text x="877" y="361" font-size="13" fill="#142738">Four task prompts</text>
<text x="877" y="383" font-size="13" fill="#142738">Converse + validation</text>
<text x="877" y="405" font-size="13" fill="#142738">Model health + deadlines</text>
<rect x="460" y="455" width="390" height="130" rx="12" fill="#f5f7fa" stroke="#bdcbd7" stroke-width="2"/>
<text x="476" y="483" font-size="17" fill="#142738" font-weight="700">Bundled data and web assets</text>
<text x="476" y="509" font-size="14" fill="#142738">70 catalog items with substitution policies</text>
<text x="476" y="535" font-size="14" fill="#142738">63 fictional locations: 53 stores + 10 relief sites</text>
<text x="476" y="561" font-size="14" fill="#142738">HTML, app JS, Leaflet, fonts, service worker</text>
<rect x="865" y="455" width="205" height="130" rx="12" fill="#fff4cc" stroke="#9b6a00" stroke-width="2"/>
<text x="879" y="483" font-size="16" fill="#9b6a00" font-weight="700">Rules fallback (ai.py)</text>
<text x="879" y="509" font-size="13" fill="#142738">Runs here inside Lambda</text>
<text x="879" y="535" font-size="13" fill="#142738">when AI is off/unavailable</text>
<text x="879" y="561" font-size="13" fill="#142738">Trace identifies rules output</text>
<rect x="1140" y="260" width="290" height="350" rx="12" fill="white" stroke="#1459a4" stroke-width="2"/>
<text x="1158" y="291" font-size="23" fill="#1459a4" font-weight="700">Amazon Bedrock</text>
<text x="1158" y="318" font-size="14" fill="#4e6172">Converse API; per-task model chains</text>
<text x="1158" y="354" font-size="17" fill="#1459a4" font-weight="700">1  Claude Haiku 4.5</text>
<text x="1180" y="374" font-size="13" fill="#4e6172">US inference profile</text>
<text x="1158" y="403" font-size="17" fill="#1459a4" font-weight="700">2  Nova 2 Lite</text>
<text x="1180" y="423" font-size="13" fill="#4e6172">US inference profile</text>
<text x="1158" y="452" font-size="17" fill="#1459a4" font-weight="700">3  Nova 2 Lite</text>
<text x="1180" y="472" font-size="13" fill="#4e6172">In-region model</text>
<text x="1158" y="501" font-size="17" fill="#1459a4" font-weight="700">4  Nova Lite</text>
<text x="1180" y="521" font-size="13" fill="#4e6172">In-region model</text>
<text x="1158" y="557" font-size="15" fill="#142738">Optional Bedrock Guardrails</text>
<text x="1158" y="581" font-size="14" fill="#4e6172">Application orchestrates the calls</text>
<path d="M1070 370 H1138" fill="none" stroke="#4e6172" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1096" y="355" font-size="12" fill="#4e6172">SDK</text>
<rect x="440" y="650" width="300" height="104" rx="12" fill="white" stroke="#142738" stroke-width="2"/>
<text x="458" y="680" font-size="20" fill="#142738" font-weight="700">Amazon DynamoDB</text>
<text x="458" y="706" font-size="15" fill="#142738">Neighbor reports; 6-hour validity</text>
<text x="458" y="730" font-size="15" fill="#142738">TTL cleanup + filtering on reads</text>
<rect x="790" y="650" width="300" height="104" rx="12" fill="white" stroke="#142738" stroke-width="2"/>
<text x="808" y="680" font-size="20" fill="#142738" font-weight="700">Amazon CloudWatch</text>
<text x="808" y="706" font-size="15" fill="#142738">Function logs</text>
<text x="808" y="730" font-size="15" fill="#142738">14-day retention</text>
<path d="M590 610 V648" fill="none" stroke="#4e6172" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M940 610 V648" fill="none" stroke="#4e6172" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1140" y="656" font-size="15" fill="#142738">AI tasks:</text>
<text x="1140" y="679" font-size="15" fill="#142738">understand, alternatives,</text>
<text x="1140" y="702" font-size="15" fill="#142738">brief, followup</text>
<text x="1140" y="725" font-size="15" fill="#142738"></text>
<text x="1140" y="748" font-size="15" fill="#142738">Each uses its own prompt;</text>
<text x="1140" y="771" font-size="15" fill="#142738">no managed Bedrock Agents.</text>
<text x="440" y="783" font-size="15" fill="#4e6172">Deployment: app/ zip → private S3 artifact bucket → Lambda, configured by CloudFormation.</text>
<rect x="40" y="455" width="320" height="170" rx="12" fill="#e3edfa" stroke="#1459a4" stroke-width="2"/>
<text x="60" y="487" font-size="20" fill="#1459a4" font-weight="700">Map display (browser)</text>
<text x="60" y="518" font-size="14" fill="#142738">Google Maps JS API when configured</text>
<text x="60" y="544" font-size="14" fill="#142738">Otherwise Leaflet + OpenStreetMap tiles</text>
<text x="60" y="570" font-size="14" fill="#142738">Google load/auth failure → Leaflet</text>
<text x="60" y="596" font-size="14" fill="#142738">Provider receives browser connections</text>
<path d="M200 400 V453" fill="none" stroke="#4e6172" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="213" y="432" font-size="13" fill="#4e6172">SDK / tiles</text>
<rect x="40" y="675" width="320" height="105" rx="12" fill="white" stroke="#142738" stroke-width="2"/>
<text x="60" y="704" font-size="20" fill="#142738" font-weight="700">Route geometry (server)</text>
<text x="60" y="730" font-size="14" fill="#142738">Drive: router.project-osrm.org</text>
<text x="60" y="750" font-size="14" fill="#142738">Walk: routing.openstreetmap.de</text>
<text x="60" y="770" font-size="14" fill="#142738">Unavailable → dashed straight line</text>
<path d="M440 585 H390 V710 H362" fill="none" stroke="#4e6172" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="377" y="640" font-size="12" fill="#4e6172">OSRM</text>
<text x="40" y="846" font-size="23" fill="#142738" font-weight="700">One understanding step, two concurrent planning lanes</text>
<text x="40" y="874" font-size="16" fill="#4e6172">The browser orchestrates these requests; code inside each endpoint checks inventory and builds the plan.</text>
<rect x="40" y="924" width="205" height="72" rx="12" fill="#fff4cc" stroke="#9b6a00" stroke-width="2"/>
<text x="57" y="953" font-size="19" fill="#9b6a00" font-weight="700">/api/understand</text>
<text x="57" y="978" font-size="14" fill="#142738">Shared needs + safety flags</text>
<rect x="300" y="902" width="820" height="52" rx="12" fill="white" stroke="#1459a4" stroke-width="2"/>
<text x="318" y="935" font-size="18" fill="#1459a4" font-weight="700">Foreground: search → alternatives if gaps → brief</text>
<rect x="300" y="972" width="820" height="52" rx="12" fill="white" stroke="#1459a4" stroke-width="2"/>
<text x="318" y="1005" font-size="17" fill="#1459a4" font-weight="700">Background: alternatives → brief (both search on the server)</text>
<path d="M245 960 H270 V928 H298" fill="none" stroke="#4e6172" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M270 960 V998 H298" fill="none" stroke="#4e6172" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1170" y="902" width="290" height="122" rx="12" fill="#e3edfa" stroke="#1459a4" stroke-width="2"/>
<text x="1188" y="934" font-size="18" fill="#1459a4" font-weight="700">/api/route for ready plans</text>
<text x="1188" y="961" font-size="14" fill="#142738">Selected lane first, then the other</text>
<text x="1188" y="987" font-size="14" fill="#142738">Geometry saved with each plan</text>
<path d="M1120 928 H1168" fill="none" stroke="#4e6172" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1120 998 H1168" fill="none" stroke="#4e6172" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="1060" font-size="16" fill="#142738">On demand: /api/followup → server rebuilds both plans → Bedrock answer, available once needs are understood.</text>
<text x="40" y="1094" font-size="16" fill="#4e6172">Failure behavior: background errors offer a lane retry; foreground errors clear both lanes and show the main retry notice.</text>
<text x="40" y="1125" font-size="16" fill="#4e6172">Local mode: the same handler via local_server.py; reports use memory + local_data/reports.json by default.</text>
</svg>
